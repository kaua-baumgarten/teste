<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Jogadores Favoritos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>Jogadores Favoritos</h1>

<a href="/adicionar/" class="btn btn-primary mb-3">
    Adicionar Jogador
</a>

<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Time</th>
        <th>Nacionalidade</th>
        <th>Ações</th>
    </tr>

    {% for jogador in jogadores %}

    <tr>

        <td>{{ jogador.id }}</td>

        <td>{{ jogador.nome }}</td>

        <td>{{ jogador.time }}</td>

        <td>{{ jogador.nacionalidade }}</td>

        <td>

            <a href="/editar/{{ jogador.id }}/"
               class="btn btn-warning btn-sm">
                Editar
            </a>

            <a href="/deletar/{{ jogador.id }}/"
               class="btn btn-danger btn-sm">
                Excluir
            </a>

        </td>

    </tr>

    {% endfor %}

</table>

</div>

</body>

</html>
